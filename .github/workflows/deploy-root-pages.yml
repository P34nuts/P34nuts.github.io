name: Deploy P34nuts Root Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment wrapper
        uses: actions/checkout@v4
      - name: Checkout P34nuts site source
        uses: actions/checkout@v4
        with:
          repository: P34nuts/p34nuts-official-website
          ref: a3bba3b9d636982f9c664c92c79cafb1a9cbf09e
          path: site
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir site install --frozen-lockfile
      - name: Build root Pages artifact
        working-directory: site
        env:
          VITE_BASE_PATH: /
          VITE_TRPC_API_ORIGIN: https://p34nuts-merch-store.onrender.com
          VITE_SHOP_URL: https://p34nuts-merch-store.onrender.com/shop
          VITE_PAYPAL_DONATION_URL: https://www.paypal.com/pool/9rRi3AduQj?sr=wccr
          GITHUB_PAGES_SITE_ORIGIN: https://p34nuts.github.io
        run: pnpm build:github-pages && cp dist/public/index.html dist/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

